name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Mount bazel cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazel-repo
          key: ${{ runner.os }}-bazel-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.13.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build
        run: bazel build //...

      - name: Test
        run: bazel test //...

  # BCR publication: every dependency must resolve from the Bazel Central
  # Registry alone. .bazelrc lists a custom registry first, which would hide
  # a dependency that BCR does not have, so the rc files are skipped here.
  # This fails until upspin is published to BCR.
  bcr_dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.13.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Resolve the module graph from BCR alone
        run: bazel --ignore_all_rc_files mod graph --registry=https://bcr.bazel.build

  # The integration module uses upspin_drive as a dependency, as BCR
  # presubmit does (.bcr/presubmit.yml). This mirrors that presubmit's
  # matrix as far as GitHub runners allow: Linux and macOS, Bazel 8 and 9.
  # It resolves from BCR alone, so it also fails until upspin is in BCR.
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bazel: ["8.x", "9.x"]
    runs-on: ${{ matrix.os }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    defaults:
      run:
        working-directory: integration
    steps:
      - uses: actions/checkout@v4

      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.13.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.job }}-${{ matrix.os }}-${{ matrix.bazel }}
          repository-cache: true

      - name: Build the upspin_drive binaries
        run: bazel build --registry=https://bcr.bazel.build @upspin_drive//cmd/upspinserver-drive @upspin_drive//cmd/upspin-setupstorage-drive

      - name: Test the integration module
        run: bazel test --registry=https://bcr.bazel.build --test_output=errors //...
