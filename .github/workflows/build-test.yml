name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Mount bazel cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazel-repo
          key: ${{ runner.os }}-bazel-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.13.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build
        run: bazel build //...

      - name: Test
        run: bazel test //...

  # BCR publication: every dependency must resolve from the Bazel Central
  # Registry alone. This runs in integration/, where upspin_drive is a
  # dependency, so its git_override for upspin does not apply, just as for
  # a real consumer; from the root, that override would hide a missing
  # upspin. .bazelrc lists a custom registry first, so the rc files are
  # skipped.
  #
  # upspin is not in BCR yet, so this cannot pass until it is. Until then
  # the step reports a warning instead of failing the job. Remove
  # the step's continue-on-error once upspin is in BCR.
  bcr_dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration
    steps:
      - uses: actions/checkout@v4

      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.13.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Resolve the module graph from BCR alone
        continue-on-error: true
        run: |
          if ! bazel --ignore_all_rc_files mod graph --registry=https://bcr.bazel.build; then
            echo "::warning::upspin_drive cannot be published to BCR yet: a dependency, upspin, is not in BCR."
            exit 1
          fi

  # The integration module uses upspin_drive as a dependency, as BCR
  # presubmit does (.bcr/presubmit.yml). This mirrors that presubmit's
  # matrix as far as GitHub runners allow: Linux and macOS, Bazel 8 and 9.
  # It resolves as .bazelrc does, from the custom registry and then BCR,
  # because upspin is in the custom registry only; bcr_dependencies above
  # checks BCR alone.
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bazel: ["8.x", "9.x"]
    runs-on: ${{ matrix.os }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
      REGISTRIES: --registry=https://raw.githubusercontent.com/filmil/bazel-registry/main --registry=https://bcr.bazel.build
    defaults:
      run:
        working-directory: integration
    steps:
      - uses: actions/checkout@v4

      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.13.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.job }}-${{ matrix.os }}-${{ matrix.bazel }}
          repository-cache: true

      - name: Build the upspin_drive binaries
        run: bazel build $REGISTRIES @upspin_drive//cmd/upspinserver-drive @upspin_drive//cmd/upspin-setupstorage-drive

      - name: Test the integration module
        run: bazel test $REGISTRIES --test_output=errors //...
